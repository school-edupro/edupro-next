name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PNPM_VERSION: 9

jobs:
  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: edupro
          POSTGRES_USER: edupro_migrator
          POSTGRES_PASSWORD: edupro_migrator_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edupro_migrator -d edupro"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      NODE_ENV: test
      DATABASE_MIGRATOR_URL: postgresql://edupro_migrator:edupro_migrator_dev@localhost:5432/edupro
      DATABASE_URL: postgresql://edupro_app:edupro_app_dev@localhost:5432/edupro
      REDIS_URL: redis://localhost:6379
      AUTH_DEV_BYPASS: "1"
      SESSION_SECRET: ci-only-session-secret-not-for-production-0123456789
      ONEAUTH_ISSUER: https://oneauth.example.test
      ONEAUTH_AUDIENCE: edupro-next
      ONEAUTH_JWKS_URL: https://oneauth.example.test/.well-known/jwks.json
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create application roles
        run: psql "$DATABASE_MIGRATOR_URL" -v ON_ERROR_STOP=1 -f packages/db/init/01_roles.sql
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Apply migrations
        run: pnpm db:migrate
      - name: RLS and procedure tests
        run: pnpm db:test
      - name: Unit and e2e tests
        run: pnpm test
      - name: Permission coverage
        run: pnpm --filter @edupro/api test:permissions
      - name: Design token lint
        run: pnpm --filter @edupro/ui lint
      - name: Dependency audit
        run: pnpm audit --audit-level=high
      - name: Build
        run: pnpm build
