name: Nightly

on:
  schedule:
    - cron: '30 20 * * *' # 02:00 IST
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate the visual baselines instead of comparing
        type: boolean
        default: false

env:
  NODE_VERSION: 22
  PNPM_VERSION: 9

jobs:
  visual-and-dast:
    name: Visual regression and DAST baseline
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: edupro
          POSTGRES_USER: edupro_migrator
          POSTGRES_PASSWORD: edupro_migrator_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U edupro_migrator -d edupro"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_MIGRATOR_URL: postgresql://edupro_migrator:edupro_migrator_dev@localhost:5432/edupro
      DATABASE_URL: postgresql://edupro_app:edupro_app_dev@localhost:5432/edupro
      REDIS_URL: redis://localhost:6379
      AUTH_DEV_BYPASS: '1'
      SESSION_SECRET: ci-only-session-secret-not-for-production-0123456789
      ONEAUTH_ISSUER: https://oneauth.example.test
      ONEAUTH_AUDIENCE: edupro-next
      ONEAUTH_JWKS_URL: https://oneauth.example.test/.well-known/jwks.json
      ONEAUTH_CLIENT_ID: edupro-admin
      ONEAUTH_CLIENT_SECRET: ci-only
      ONEAUTH_REDIRECT_URI: http://localhost:3000/api/auth/callback
      API_BASE_URL: http://localhost:4000
      INTERNAL_API_BASE_URL: http://localhost:4000
      EXPORT_PDF_ENGINE: none
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: psql "$DATABASE_MIGRATOR_URL" -v ON_ERROR_STOP=1 -f packages/db/init/01_roles.sql
      - run: pnpm db:migrate
      - run: pnpm --filter @edupro/db seed:dev
      - run: pnpm --filter @edupro/admin exec playwright install --with-deps chromium
      - name: Build and start the stack
        run: |
          pnpm --filter @edupro/storage --filter @edupro/db --filter @edupro/ui --filter @edupro/api build
          (cd apps/api && node dist/main.js > /tmp/api.log 2>&1 &)
          pnpm --filter @edupro/admin build
          (cd apps/admin && pnpm start > /tmp/admin.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:4000/api/v1/health && curl -sf http://localhost:3000/login >/dev/null && break; sleep 2; done
      - name: Visual regression (Linux baselines in apps/admin/e2e/visual/screens.spec.ts-snapshots)
        run: pnpm --filter @edupro/admin e2e:visual ${{ inputs.update_snapshots && '-- --update-snapshots' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-baselines-and-report
          path: |
            apps/admin/e2e/visual/screens.spec.ts-snapshots
            apps/admin/playwright-report
            apps/admin/test-results
      - name: DAST baseline (OWASP ZAP) against the admin app
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:3000
          rules_file_name: .zap/rules.tsv
          cmd_options: -a -j
          fail_action: true
          allow_issue_writing: false
      - name: DAST baseline (OWASP ZAP) against the API
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:4000/api/v1/health
          rules_file_name: .zap/rules.tsv
          cmd_options: -a
          fail_action: true
          allow_issue_writing: false
